<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Progression Checker // Terminal</title>
<style>
:root {
  --bg:#07100c; --panel:#0b1711; --line:#21462f; --text:#c7f9d4;
  --dim:#77a985; --bright:#73ff98; --amber:#ffc85c; --red:#ff7070;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Courier New", ui-monospace, SFMono-Regular, Menlo, monospace;
  min-height:100%;
}
body:before{
  content:""; pointer-events:none; position:fixed; inset:0;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 1px,transparent 4px);
}
.shell{max-width:900px;margin:0 auto;padding:28px 20px 50px}
.topbar{
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:28px;
  color:var(--dim);font-size:.82rem;letter-spacing:.06em
}
.brand{color:var(--bright);font-weight:700}
.screen{
  border:1px solid var(--line);background:var(--panel);padding:28px;
  box-shadow:inset 0 0 40px rgba(57,255,116,.035);
}
.kicker{color:var(--dim);font-size:.78rem;letter-spacing:.12em;margin-bottom:8px}
h1{font-size:1.45rem;color:var(--bright);margin:0 0 24px;letter-spacing:.04em}
.log p{line-height:1.62;margin:.7em 0}
.prompt{margin-top:24px;color:white;font-weight:700;line-height:1.55}
.prompt:before{content:"> ";color:var(--bright)}
.choices{margin-top:18px;display:grid;gap:10px}
.choice{
  width:100%;text-align:left;padding:13px 15px;background:#0b1711;
  color:var(--text);border:1px solid #285b3a;font:inherit;cursor:pointer;
}
.choice:before{content:"[ ";color:var(--dim)} .choice:after{content:" ]";color:var(--dim)}
.choice:hover,.choice:focus{outline:none;border-color:var(--bright);color:white;background:#102218}
.outcome{margin-top:26px;padding:18px;border:1px solid;font-weight:700;font-size:1.05rem;letter-spacing:.04em}
.outcome.green{color:var(--bright);border-color:var(--bright)}
.outcome.amber{color:var(--amber);border-color:var(--amber)}
.outcome.red{color:var(--red);border-color:var(--red)}
.status{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px;font-size:.78rem
}
.status div{border:1px solid var(--line);padding:8px;color:var(--dim)}
.status strong{color:var(--text)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.tool{background:transparent;border:1px solid var(--line);color:var(--dim);padding:9px 12px;font:inherit;cursor:pointer}
.tool:hover{color:var(--bright);border-color:var(--bright)}
.footer{margin-top:16px;color:var(--dim);font-size:.78rem;line-height:1.5}
.cursor{display:inline-block;width:.62em;height:1em;background:var(--bright);vertical-align:-.12em;margin-left:4px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cursor{animation:none}}
@media(max-width:620px){.screen{padding:20px}.status{grid-template-columns:1fr}h1{font-size:1.25rem}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand">ABERTAY // PROGRESSION TERMINAL</div>
    <div>UG STAGES 1–4 · REGS 39–51</div>
  </div>
  <main class="screen" id="screen" aria-live="polite"></main>
  <div class="footer">DECISION AID ONLY // Formal progression decisions are made by the Programme Assessment Board. Condonement is discretionary. Academic appeal rights remain unaffected.</div>
</div>
<script>
const nodes={"Start": {"title": "CASE INITIALISED", "text": ["A student record has arrived for progression review.", "Your task is to determine the appropriate undergraduate progression outcome under Regulations 39\u201351."], "prompt": "Has the student received NS in all modules in the term?", "choices": [["YES \u2014 all modules are NS", "NSWithdraw"], ["NO \u2014 continue assessment", "ModuleHistory"]]}, "NSWithdraw": {"title": "CASE OUTCOME", "text": ["Reg. 39: A student with NS in all modules in a term will normally be required to withdraw.", "Reg. 40: The Programme Assessment Board makes the formal decision. The student retains the right of appeal."], "outcome": "NORMALLY WITHDRAW", "tone": "red"}, "ModuleHistory": {"title": "MODULE HISTORY CHECK", "text": ["Before counting credits, inspect the student's module history."], "prompt": "Is any failed or outstanding module (or agreed substitute) being taken in the student's SECOND academic session?", "choices": [["YES \u2014 a module is being repeated", "RepeatedModule"], ["NO \u2014 current failures are first-session failures", "CreditCount"]]}, "RepeatedModule": {"title": "FINAL SESSION DETECTED", "text": ["Regs. 48 & 51: This module (or agreed substitute) is now in its second and final permitted academic session.", "Under the normal pattern, this means main assessment + resit in the first session, then main assessment + resit in the repeat session.", "The repeated module MUST be passed for the student to progress."], "prompt": "What is the status of the repeated module?", "choices": [["PASSED \u2014 continue", "CreditCount"], ["MAIN REPEAT FAILED \u2014 final resit remains", "FinalPending"], ["FINAL PERMITTED ATTEMPT FAILED", "FinalFailed"]]}, "FinalPending": {"title": "PROGRESSION LOCKED", "text": ["The repeated module has not yet been passed.", "If eligible, the remaining resit is the final permitted attempt.", "Progression cannot be confirmed until the result is known."], "prompt": "Update the case after the final attempt:", "choices": [["FINAL ATTEMPT PASSED", "CreditCount"], ["FINAL ATTEMPT FAILED", "FinalFailed"]]}, "FinalFailed": {"title": "CASE OUTCOME", "text": ["Regs. 48, 49 & 51: The repeated module has been failed on its final permitted attempt.", "It cannot be taken in a third academic session. The module must be passed for progression.", "The student will therefore normally be required to withdraw, subject to the formal PAB decision and appeal process."], "outcome": "CANNOT PROGRESS / NORMALLY WITHDRAW", "tone": "red"}, "CreditCount": {"title": "CREDIT AUDIT", "text": ["Count the stage credits currently passed."], "prompt": "How many stage credits have been passed?", "choices": [["120 CREDITS", "FullPass"], ["95\u2013119 CREDITS", "Carry"], ["60\u201394 CREDITS", "Sixty"], ["FEWER THAN 60 CREDITS", "Under60"]]}, "FullPass": {"title": "CASE OUTCOME", "text": ["Reg. 41: The standard undergraduate stage requirement has been met.", "120 credits with passing grades permits progression to the next stage."], "outcome": "PROCEED TO NEXT STAGE", "tone": "green"}, "Carry": {"title": "CARRIED CREDIT CHECK", "text": ["Reg. 44: A student with at least 95 credits may normally proceed while carrying failed module(s), or agreed substitutes, into the next academic year."], "prompt": "Is any failed module a prerequisite that MUST be passed before progression?", "choices": [["YES \u2014 prerequisite failed", "RepeatStudy"], ["NO \u2014 no blocking prerequisite", "ProceedCarry"]]}, "ProceedCarry": {"title": "CASE OUTCOME", "text": ["Reg. 44: The student may proceed while carrying the failed module(s), or agreed substitutes, into the next academic year.", "Regs. 48 & 51: The carried module is entering its second academic session and must be passed within that session."], "outcome": "PROCEED WITH CARRIED MODULE(S)", "tone": "green"}, "Sixty": {"title": "INSUFFICIENT CREDIT FOR PROGRESSION", "text": ["Reg. 45: With at least 60 but fewer than 95 credits, the student will normally undertake repeat study if eligible."], "prompt": "Could condonement potentially change the credit position?", "choices": [["CHECK CONDONEMENT", "Condone"], ["NO \u2014 condonement clearly unavailable", "RepeatStudy"]]}, "Condone": {"title": "CONDONEMENT PROTOCOL", "text": ["Reg. 42: At the end-of-year PAB, one module of up to 20 credits with an overall grade of MF may be condoned, provided no more than 40 credits are outstanding.", "Condonement is discretionary. It cannot apply to a Core Prerequisite, a module integral to stage learning outcomes, or one required for PSRB validation."], "prompt": "Does the failed module satisfy the conditions for possible condonement?", "choices": [["YES \u2014 PAB condones the module", "Recalc"], ["NO \u2014 condonement unavailable", "RepeatStudy"], ["STUDY ABROAD CASE", "StudyAbroad"]]}, "StudyAbroad": {"title": "STUDY ABROAD PROTOCOL", "text": ["Reg. 43: PAB may condone the equivalent of up to 20 SCQF credits of marginally failed study-abroad modules where no condonement is applied to Abertay modules."], "prompt": "Recalculate the student's credit position.", "choices": [["CONTINUE", "Recalc"]]}, "Recalc": {"title": "RECALCULATE CREDIT", "text": ["Apply only the PAB-approved condonement."], "prompt": "What is the revised stage position?", "choices": [["120 CREDITS", "FullPass"], ["95\u2013119 CREDITS", "Carry"], ["60\u201394 CREDITS", "RepeatStudy"], ["FEWER THAN 60 CREDITS", "Under60"]]}, "Under60": {"title": "CASE OUTCOME", "text": ["Reg. 46: A student who has passed fewer than 60 credits of a stage will normally be required to withdraw.", "Reg. 40: The formal decision rests with PAB and remains subject to the Academic Appeals Procedure."], "outcome": "NORMALLY WITHDRAW", "tone": "red"}, "RepeatStudy": {"title": "REPEAT STUDY PROTOCOL", "text": ["Reg. 48: During repeat study the student must participate fully and complete all assessments. Previous attempts are not carried forward.", "The repeated module(s) must be passed for progression."], "prompt": "Check eligibility to repeat.", "choices": [["CONTINUE TO REPEAT LIMITS", "StageRepeat"]]}, "StageRepeat": {"title": "STAGE REPEAT LIMIT", "text": ["Reg. 49: A stage may be repeated once only. After a repeated stage, the stage requirements must be passed in full."], "prompt": "Has THIS stage already been repeated?", "choices": [["YES \u2014 this stage has already been repeated", "RepeatExhausted"], ["NO \u2014 this would be its first repeat", "TotalRepeats"]]}, "TotalRepeats": {"title": "PROGRAMME REPEAT LIMIT", "text": ["Reg. 50: No student may repeat more than two stages of study."], "prompt": "Have two stages already been repeated?", "choices": [["YES \u2014 two stage repeats already used", "RepeatExhausted"], ["NO \u2014 fewer than two repeats used", "ModuleLimit"]]}, "ModuleLimit": {"title": "MODULE SESSION LIMIT", "text": ["Reg. 51: The same module, or a module plus agreed substitute, cannot be taken in more than two academic sessions."], "prompt": "Has this module/substitute already been taken in two academic sessions?", "choices": [["YES \u2014 two sessions used and still failed", "FinalFailed"], ["NO \u2014 only one session used", "RepeatAllowed"]]}, "RepeatAllowed": {"title": "CASE OUTCOME", "text": ["The student is eligible for repeat study, subject to the formal PAB decision and programme requirements.", "This repeat year is the module's second and final academic session. It must be passed."], "outcome": "REPEAT STUDY", "tone": "amber"}, "RepeatExhausted": {"title": "CASE OUTCOME", "text": ["The applicable repeat limit has been reached.", "If the student cannot meet the stage requirements, they will normally be required to withdraw."], "outcome": "NO FURTHER REPEAT / NORMALLY WITHDRAW", "tone": "red"}};
let current="Start", historyStack=[], step=1;

function render(name, push=true){
  if(push && current!==name) historyStack.push(current);
  current=name;
  if(push) step++;
  const n=nodes[name], root=document.getElementById("screen");
  const paras=n.text.map(x=>`<p>${x}</p>`).join("");
  const prompt=n.prompt?`<div class="prompt">${n.prompt}<span class="cursor"></span></div>`:"";
  const choices=(n.choices||[]).map(([label,target],i)=>`<button class="choice" type="button" data-target="${target}">${String(i+1).padStart(2,"0")} // ${label}</button>`).join("");
  const outcome=n.outcome?`<div class="outcome ${n.tone||""}">OUTCOME // ${n.outcome}</div>`:"";
  root.innerHTML=`
    <div class="status">
      <div>CASE <strong>OPEN</strong></div>
      <div>NODE <strong>${String(step).padStart(2,"0")}</strong></div>
      <div>PAB STATUS <strong>${n.outcome?"DECISION POINT":"REVIEWING"}</strong></div>
    </div>
    <div class="kicker">${n.title}</div>
    <h1>${name==="Start"?"STUDENT PROGRESSION CHECKER":"ASSESSMENT IN PROGRESS"}</h1>
    <div class="log">${paras}</div>
    ${prompt}<div class="choices">${choices}</div>${outcome}
    <div class="tools">
      ${historyStack.length?'<button class="tool" type="button" id="back">← BACK</button>':""}
      <button class="tool" type="button" id="restart">↻ RESTART CASE</button>
    </div>`;
  root.querySelectorAll("[data-target]").forEach(b=>b.addEventListener("click",()=>render(b.dataset.target,true)));
  const back=root.querySelector("#back");
  if(back) back.addEventListener("click",()=>{ const prev=historyStack.pop(); step=Math.max(1,step-1); render(prev,false); });
  root.querySelector("#restart").addEventListener("click",()=>{historyStack=[];step=1;current="Start";render("Start",false)});
  window.scrollTo({top:0,behavior:"smooth"});
}
render("Start",false);
</script>
</body>
</html>
